- model: ui.view
  ext_id: practice_checklist_view_checklist_list
  fields:
    name: "Checklists - Lista"
    title:
      i18n_key: "practice_checklist.views.checklist_list"
      $fallback: "Checklists - List"
    model_key: practice_checklist.checklist
    type_id.ext_id: ui.ui_view_type_list
    definition:
      columns:
        - { field: id, label: ID, width: 70 }
        - { field: name, label: Checklist, sortable: true }
        - { field: status, label: Estado, chip: true }
        - { field: owner_id, label: Responsable }
        - { field: is_public, label: Público, width: 90 }
        - { field: closed_at, label: Cerrado en }
      actions:
        - name: new
          type: create
          icon: mdi-plus
          label: "Nuevo Checklist"
          i18n_key: "practice_checklist.checklist.actions.new"
        - name: edit
          type: update
          icon: mdi-pencil
          label: "Editar"
          i18n_key: "practice_checklist.checklist.actions.edit"
        - name: delete
          type: delete
          icon: mdi-delete
          label: "Borrar"
          i18n_key: "practice_checklist.checklist.actions.delete"
      row_actions:
        - key: close
          type: service
          label: "Cerrar"
          icon: mdi-check
          method: close
          model_key: practice_checklist.checklist
          groups: [practice_checklist_group_manager, core_group_superadmin]
          confirm:
            text: "¿Cerrar checklist?"
        - key: reopen
          type: service
          label: "Reabrir"
          icon: mdi-lock-open-variant-outline
          method: reopen
          model_key: practice_checklist.checklist
          groups: [practice_checklist_group_manager, core_group_superadmin]
          confirm:
            text: "¿Reabrir checklist?"

- model: ui.view
  ext_id: practice_checklist_view_checklist_form
  fields:
    name: "Checklist - Formulario"
    title:
      i18n_key: "practice_checklist.views.checklist_form"
      $fallback: "Checklist - Form"
    model_key: practice_checklist.checklist
    type_id.ext_id: ui.ui_view_type_form
    definition:
      groups:
        - label: Básico
          fields: [name, status, owner_id, is_public]
        - label: Descripción
          fields: [description]
        - label: Auditoría
          fields: [closed_at]
      form_actions:
        - key: close
          type: service
          label: "Cerrar"
          icon: mdi-check
          method: close
          groups: [practice_checklist_group_manager, core_group_superadmin]
          confirm:
            text: "¿Cerrar checklist?"
        - key: reopen
          type: service
          label: "Reabrir"
          icon: mdi-lock-open-variant-outline
          method: reopen
          groups: [practice_checklist_group_manager, core_group_superadmin]
          confirm:
            text: "¿Reabrir checklist?"

- model: ui.view
  ext_id: practice_checklist_view_item_list
  fields:
    name: "Items - Lista"
    title:
      i18n_key: "practice_checklist.views.item_list"
      $fallback: "Items - List"
    model_key: practice_checklist.checklist_item
    type_id.ext_id: ui.ui_view_type_list
    definition:
      columns:
        - { field: id, label: ID, width: 70 }
        - { field: checklist, label: Checklist }
        - { field: title, label: Ítem, sortable: true }
        - { field: assigned_user_id, label: Asignado }
        - { field: is_done, label: Hecho, chip: true }
        - { field: done_at, label: Hecho en }
      actions:
        - name: new
          type: create
          icon: mdi-plus
          label: "Nuevo Item"
          i18n_key: "practice_checklist.checklist_item.actions.new"
        - name: edit
          type: update
          icon: mdi-pencil
          label: "Editar"
          i18n_key: "practice_checklist.checklist_item.actions.edit"
        - name: delete
          type: delete
          icon: mdi-delete
          label: "Borrar"
          i18n_key: "practice_checklist.checklist_item.actions.delete"
      bulk_actions:
        - key: bulk_set_done
          type: service
          label: "Marcar como hechos"
          icon: mdi-check-all
          method: set_done
          model_key: practice_checklist.checklist_item
          groups: [practice_checklist_group_manager, core_group_superadmin]
          params:
            - name: done
              label: Hecho
              type: boolean
              default: true
        - key: bulk_set_pending
          type: service
          label: "Marcar como pendientes"
          icon: mdi-undo-variant
          method: set_done
          model_key: practice_checklist.checklist_item
          groups: [practice_checklist_group_manager, core_group_superadmin]
          params:
            - name: done
              label: Hecho
              type: boolean
              default: false
      row_actions:
        - key: mark_done
          type: service
          label: "Marcar hecho"
          icon: mdi-check
          method: set_done
          model_key: practice_checklist.checklist_item
          groups: [practice_checklist_group_manager, core_group_superadmin]
        - key: mark_pending
          type: service
          label: "Marcar pendiente"
          icon: mdi-undo
          method: set_done
          model_key: practice_checklist.checklist_item
          groups: [practice_checklist_group_manager, core_group_superadmin]
          params:
            - name: done
              label: Hecho
              type: boolean
              default: false

- model: ui.view
  ext_id: practice_checklist_view_item_form
  fields:
    name: "Ítem - Formulario"
    title:
      i18n_key: "practice_checklist.views.item_form"
      $fallback: "Item - Form"
    model_key: practice_checklist.checklist_item
    type_id.ext_id: ui.ui_view_type_form
    definition:
      groups:
        - label: Básico
          fields: [checklist_id, title, assigned_user_id, is_done]
        - label: Nota
          fields: [note]
        - label: Auditoría
          fields: [done_at]
      form_actions:
        - key: set_done
          type: service
          label: "Actualizar estado"
          icon: mdi-check-decagram
          method: set_done
          groups: [practice_checklist_group_manager, core_group_superadmin]